<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="description" content="从 English Grammar 总图谱逐层探索十个模块，阅读知识卡片、点亮学习星图，完成语法练习和50关词性积木游戏。">
  <title>English Grammar · 语法图谱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%235c7891'/%3E%3Ccircle cx='20' cy='20' r='4' fill='white'/%3E%3Cpath d='M20 16V8m4 12h8m-12 4v8m-4-12H8' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="responsive.css?v=9">
  <link rel="stylesheet" href="games.css?v=9">
</head>
<body data-page="map">
  <main id="app">
    <section id="map-page" class="page active" aria-label="英语语法总图谱">
      <svg id="mindmap" class="graph-canvas" aria-label="可逐层探索的语法图谱" tabindex="0"><g id="map-transform"></g></svg>
    </section>
    <section id="progress-page" class="page universe-page" aria-label="学习星图">
      <div class="universe-haze" aria-hidden="true"></div>
      <svg id="constellation" class="graph-canvas" aria-label="已学知识点会点亮的语法星图" tabindex="0">
        <defs><filter id="star-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.3"/></filter></defs>
        <g id="universe-transform"></g>
      </svg>
      <div id="star-caption" class="star-caption"></div>
    </section>
    <section id="practice-page" class="page practice-page" aria-label="练习中心"></section>
    <section id="games-page" class="page games-page" aria-label="语法游戏"></section>
  </main>
  <div id="card-scrim" class="card-scrim" hidden data-action="close-card"></div>
  <aside id="knowledge-card" class="knowledge-card" hidden tabindex="-1" aria-label="知识详情卡片"></aside>
  <nav id="orbit-menu" class="orbit-menu" aria-label="页面导航" hidden>
    <button data-route="map"><span data-icon="map"></span><span>总地图<small>English Grammar</small></span></button>
    <button data-route="practice"><span data-icon="exercise"></span><span>练习中心<small>按知识点巩固</small></span></button>
    <button data-route="progress"><span data-icon="stars"></span><span>学习星图<small>查看已点亮的知识</small></span></button>
    <button data-route="games"><span data-icon="game"></span><span>游戏<small>词性积木 · 50 关</small></span></button>
    <button id="parent-action" data-action="parent-map" hidden><span data-icon="back"></span><span>返回上一级</span></button>
    <div class="orbit-tools">
      <button data-action="search" aria-label="搜索知识点" title="搜索知识点" data-icon="search"></button>
      <button data-action="notebook" aria-label="收藏与笔记" title="收藏与笔记" data-icon="bookmark"></button>
      <button data-action="backup" aria-label="学习记录备份" title="学习记录备份" data-icon="backup"></button>
      <button data-action="fit" aria-label="适应画面" title="适应画面" data-icon="fit"></button>
      <button data-action="help" aria-label="操作说明" title="操作说明" data-icon="help"></button>
    </div>
  </nav>
  <button id="nav-orb" class="nav-orb" data-action="toggle-nav" aria-label="打开导航" aria-expanded="false" aria-controls="orbit-menu"><span data-icon="orbit"></span></button>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="content.js?v=9"></script>
  <script src="atlas.js?v=9"></script>
  <script src="graph.js?v=9"></script>
  <script src="games-content.js?v=9"></script>
  <script src="progress.js?v=9"></script>
  <script src="games.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
